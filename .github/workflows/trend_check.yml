name: ⚡ Google Trends Velocity Watchdog

on:
  schedule:
    # Executes every single hour, 24/7 (at minute 0)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (inspect and evaluate without triggering dispatch)'
        required: false
        type: boolean
        default: false
      force_publish:
        description: 'Force publish top topic regardless of urgency score'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-trends:
    name: 🔍 Scan Velocity & Detect Spikes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚡ Run Trend Velocity Watchdog
        env:
          # GitHub Token for repository_dispatch trigger
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_SECRETS || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

          # Groq Chief Intelligence LLM
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}

          # Cerebras & OpenRouter Failover Brains
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || 'meta-llama/llama-3.3-70b-instruct' }}

          # Discord Webhook for Instant Spike Alerts
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

          # Supabase Post History Memory
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          FLAGS="--once"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force_publish }}" = "true" ]; then
            FLAGS="$FLAGS --force-publish"
          fi
          python trend_checker.py $FLAGS
