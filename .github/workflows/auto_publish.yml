name: 🚀 Autonomous Instagram Publisher
on:
  schedule:
    # 🌅 Morning Slot: 7:00 AM IST (01:30 UTC) - Single Photo Infographic/Cheatsheet
    - cron: '30 1 * * *'
    # 🌆 Evening Slot: 7:00 PM IST (13:30 UTC) - Educational Listicle / Architecture Flow
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Publishing Slot (auto detects based on current UTC time)'
        required: true
        type: choice
        options:
          - auto
          - morning
          - evening
        default: 'auto'
      format:
        description: 'Format Override (auto delegates to slot weekly calendar)'
        required: false
        type: choice
        options:
          - auto
          - photo
          - listicle
          - flow
        default: 'auto'
      topic:
        description: 'Optional: Force a specific topic (leave empty for auto trend discovery)'
        required: false
        default: ''
      dry_run:
        description: 'Dry Run (generates & renders without publishing to Instagram)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    name: ⚡ Discover, Plan, Render & Publish Carousel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎭 Install Playwright Chromium with Linux System Dependencies
        run: |
          playwright install chromium --with-deps

      - name: 🚀 Run Autonomous Social Engine Pipeline
        env:
          # Groq AI (Tier 1 Fast Chief Editor)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}

          # Cerebras AI (Tier 2 Secondary Brain Failover)
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_MODEL: ${{ secrets.CEREBRAS_MODEL || 'gpt-oss-120b' }}

          # Nvidia NIM (Tier 4 Visual Composition & Layout Audit)
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_VISION_MODEL: ${{ secrets.NVIDIA_VISION_MODEL || 'meta/llama-3.2-11b-vision-instruct' }}

          # GitHub Models Vision API (Tier 3 GPT-4o Vision Inspector)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN_MODELS || secrets.GITHUB_TOKEN }}
          GITHUB_VISION_MODEL: ${{ secrets.GITHUB_VISION_MODEL || 'gpt-4o' }}

          # Apify Intelligence Radar (AI Agents & Developer Tools)
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          APIFY_DATASET_ID: ${{ secrets.APIFY_DATASET_ID }}
          APIFY_TASK_ID: ${{ secrets.APIFY_TASK_ID }}

          # Logo & Brand Asset Resolvers
          LOGODEV_PUBLISHABLE_KEY: ${{ secrets.LOGODEV_PUBLISHABLE_KEY }}
          LOGODEV_SECRET_KEY: ${{ secrets.LOGODEV_SECRET_KEY }}
          BRANDFETCH_API_KEY: ${{ secrets.BRANDFETCH_API_KEY }}

          # Supabase Database & Memory
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # Cloudinary Media CDN
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

          # Meta / Instagram Graph API
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_USERNAME: ${{ secrets.IG_USERNAME || 'vmatrix.co' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

          # Gemini Guard (Kept dormant unless explicitly enabled)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENABLE_GEMINI: ${{ secrets.ENABLE_GEMINI || 'false' }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            FLAGS="$FLAGS --slot ${{ github.event.inputs.slot }}"
          fi
          if [ -n "${{ github.event.inputs.format }}" ]; then
            FLAGS="$FLAGS --format ${{ github.event.inputs.format }}"
          fi
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            FLAGS="$FLAGS --topic \"${{ github.event.inputs.topic }}\""
          fi
          python autonomous_publisher.py $FLAGS

      - name: 💾 Commit Updated Post History Memory
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/post_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(memory): record automated published post to 30-day history [skip ci]" && git push)
